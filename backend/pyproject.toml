[project]
name = "scholarscout-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.30.6",
    "openai==1.51.0",
    "httpx==0.27.2",
    "python-dotenv>=1.2.2",
    "feedparser>=6.0.12",
    "passlib[bcrypt]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "redis>=5.0",
    "structlog>=24.0",
    "sentry-sdk[fastapi]>=2.0",
    "email-validator",
    "pypdf>=6.12.0",
    "python-multipart>=0.0.31",
    "apscheduler>=3.10.0,<4.0",
    "aiosmtplib>=5.1.1",
    "alembic>=1.18.4",
    "chromadb>=1.5.9",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
